[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
line_length = 120

# ==== black ====
[tool.black]
line-length = 120
target-version = ['py312']


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
match = "match.main.cli.app:run_cli"
