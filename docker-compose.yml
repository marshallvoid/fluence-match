services:
   api:
      container_name: fluence-match_api
      build: .
      ports:
         - "8000:8000"
      depends_on:
         # - qdrant
         - redis
         - nats
      links:
         - nats

   worker:
      container_name: fluence-match_worker
      build: .
      depends_on:
         - nats
         # - qdrant
         - redis
      entrypoint: ["match", "worker"]
      links:
         - nats

   # neo4j:
