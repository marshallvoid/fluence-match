   redis:
      container_name: redis
      image: "bitnami/redis:7.2"
      restart: on-failure
      environment:
         - "REDIS_PASSWORD=${REDIS_PASSWORD:-1234}"
         - "REDIS_PORT_NUMBER=${REDIS_PORT:-6379}"

   nats:
      container_name: nats
      image: "nats:2.10"
      restart: on-failure
      environment:
         - "NATS_PORT=${NATS_PORT:-4222}"
         - "NATS_HTTP_PORT=${NATS_HTTP_PORT:-8222}"
      ports:
         - "4222:4222"
         - "8222:8222"
      command:
         - "--http_port=8222"
         - "--js"
         - "--sd=/data"
      volumes:
         - nats_data:/data

volumes:
   nats_data: {}
